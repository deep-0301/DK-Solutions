name: Post Instagram reel

# Posts at most one approved, due reel from social/schedule.json per run.
# Tue, Thu and Sat at 15:30 UTC (10:30am Eastern in winter).
on:
  schedule:
    - cron: "30 15 * * 2,4,6"
    # Mondays: refresh the 60-day Instagram token (needs the GH_PAT secret).
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would post, post nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 15 * * 2,4,6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post next reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 social/tools/post_reel.py
      - name: Record what was posted
        run: |
          if ! git diff --quiet social/schedule.json; then
            git config user.name "dk-solutions-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Instagram: mark reel as posted"
            git push
          fi

  refresh-token:
    if: github.event.schedule == '0 12 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh token and save it back to the repo secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT secret not set, so the Instagram token can't be renewed automatically. It expires 60 days after it was made."
            exit 0
          fi
          NEW=$(python3 social/tools/post_reel.py refresh)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "Token refreshed."
