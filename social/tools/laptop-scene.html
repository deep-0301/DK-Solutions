<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:DM;src:url(/social/concepts/fonts/dm-sans-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Playfair;src:url(/social/concepts/fonts/playfair-display-latin-500-italic.woff2);font-style:italic}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#1a120c}
canvas{display:block}
#fx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 45%,transparent 55%,rgba(10,5,2,.55) 100%)}
#hook{position:absolute;left:70px;right:70px;top:250px;text-align:center;font:700 64px/1.1 DM,sans-serif;color:#fff;letter-spacing:-.02em;text-shadow:0 6px 30px rgba(0,0,0,.55);opacity:0}
#hook i{font-family:Playfair,serif;font-weight:500;color:#ffd9a8}
#tag{position:absolute;left:0;right:0;bottom:260px;text-align:center;font:700 30px DM,sans-serif;letter-spacing:.04em;color:#fff;opacity:0;text-shadow:0 4px 20px rgba(0,0,0,.6)}
#tag b{display:inline-block;margin-top:14px;padding:16px 34px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.35)}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<div id="fx"></div><div id="hook"></div><div id="tag"></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
scene.background = new THREE.Color(0x0d0805);

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// Desk: warm oak planks
const wood = canvasTex(2048, 2048, (g, w, h) => {
  const planks = 6;
  for (let p = 0; p < planks; p++) {
    const y0 = (p * h) / planks, ph = h / planks;
    const base = [112 + rnd() * 22, 70 + rnd() * 14, 42 + rnd() * 10];
    g.fillStyle = `rgb(${base})`; g.fillRect(0, y0, w, ph);
    for (let i = 0; i < 260; i++) {
      const yy = y0 + rnd() * ph, a = rnd() * 0.12;
      g.strokeStyle = `rgba(${rnd() < .5 ? '60,35,18' : '200,150,100'},${a})`; g.lineWidth = 1 + rnd() * 3;
      g.beginPath(); g.moveTo(0, yy);
      for (let x = 0; x <= w; x += 64) g.lineTo(x, yy + Math.sin(x * 0.004 + i) * 6 + (rnd() - .5) * 3);
      g.stroke();
    }
    g.fillStyle = 'rgba(40,22,10,.55)'; g.fillRect(0, y0, w, 3);
  }
}, [1.5, 1.67]);
const desk = new THREE.Mesh(new THREE.PlaneGeometry(6, 5), new THREE.MeshStandardMaterial({ map: wood, roughness: 0.55, metalness: 0 }));
desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true; scene.add(desk);

// Background room (kept out of focus by the depth of field): dark wall,
// a bright window on the left, warm string lights and a plant.
const wallTex = canvasTex(1024, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, '#5a4230'); gr.addColorStop(.5, '#2e2118'); gr.addColorStop(1, '#1a120c');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '0,0,0' : '255,230,200'},${rnd() * 0.04})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
});
const wall = new THREE.Mesh(new THREE.PlaneGeometry(7, 3.2), new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.95 }));
wall.position.set(0, 1.0, -2.4); wall.receiveShadow = true; scene.add(wall);
const winMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffe2bd).multiplyScalar(1.4), toneMapped: true });
const frameMat = new THREE.MeshStandardMaterial({ color: 0x1a120c, roughness: 0.8 });
const win = new THREE.Group(); win.position.set(-0.95, 0.75, -2.38); scene.add(win);
win.add(new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.3), winMat));
for (const [x, y, w2, h2] of [[0, 0, 0.04, 1.3], [0, 0.1, 1.0, 0.035], [-0.5, 0, 0.05, 1.34], [0.5, 0, 0.05, 1.34], [0, 0.65, 1.04, 0.05], [0, -0.65, 1.04, 0.05]]) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w2, h2), frameMat); m.position.set(x, y, 0.005); win.add(m);
}
// String lights: a drooping line of warm bulbs (they bloom into bokeh).
const bulbMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffb766).multiplyScalar(5) });
for (let i = 0; i < 26; i++) {
  const u = i / 25, x = -1.1 + u * 2.6, y = 0.66 - Math.sin(u * Math.PI * 3) * 0.06 - Math.sin(u * Math.PI) * 0.08;
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.012, 10, 8), bulbMat); bulb.position.set(x, y, -2.25); scene.add(bulb);
}
// Plant in a pot, back left.
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f5a2a, roughness: 0.6, side: THREE.DoubleSide });
const plant = new THREE.Group(); plant.position.set(-0.62, 0, -0.75); scene.add(plant);
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.06, 0.15, 32), new THREE.MeshStandardMaterial({ color: 0xd9cfc2, roughness: 0.7 }));
pot.position.y = 0.075; pot.castShadow = true; plant.add(pot);
for (let i = 0; i < 16; i++) {
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), leafMat); leaf.scale.set(0.35, 1, 0.08);
  const a = rnd() * Math.PI * 2, r = 0.02 + rnd() * 0.05;
  leaf.position.set(Math.cos(a) * r, 0.2 + rnd() * 0.16, Math.sin(a) * r); leaf.rotation.set((rnd() - .5) * 1.2, a, (rnd() - .5) * 1.4); leaf.castShadow = true; plant.add(leaf);
}

// Laptop
const alu = new THREE.MeshPhysicalMaterial({ color: 0x8e9197, metalness: 0.9, roughness: 0.38, clearcoat: 0.3 });
const LW = 0.34, LD = 0.235, LT = 0.011;
const laptop = new THREE.Group(); scene.add(laptop);
const base = new THREE.Mesh(new RoundedBoxGeometry(LW, LT, LD, 4, 0.006), alu); base.position.y = LT / 2; base.castShadow = base.receiveShadow = true; laptop.add(base);
const keysTex = canvasTex(1024, 512, (g, w, h) => {
  g.fillStyle = '#16171a'; g.fillRect(0, 0, w, h);
  const rows = 6, cols = 14, pad = 6, kw = (w - pad) / cols, kh = (h - pad) / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    let x = pad + c * kw, ww = kw - pad;
    if (r === 5 && c > 3 && c < 10) { if (c !== 4) continue; ww = kw * 6 - pad; }
    g.fillStyle = '#26282d'; g.beginPath(); g.roundRect(x, pad + r * kh, ww, kh - pad, 8); g.fill();
  }
});
const kb = new THREE.Mesh(new THREE.PlaneGeometry(LW * 0.86, LD * 0.42), new THREE.MeshStandardMaterial({ map: keysTex, roughness: 0.6 }));
kb.rotation.x = -Math.PI / 2; kb.position.set(0, LT + 0.0005, -LD * 0.17); laptop.add(kb);
const pad = new THREE.Mesh(new RoundedBoxGeometry(LW * 0.38, 0.0008, LD * 0.3, 2, 0.0004), new THREE.MeshPhysicalMaterial({ color: 0xc3c6cb, metalness: 0.7, roughness: 0.25 }));
pad.position.set(0, LT + 0.0004, LD * 0.28); laptop.add(pad);
const hinge = new THREE.Group(); hinge.position.set(0, LT, -LD / 2 + 0.004); laptop.add(hinge);
const lidH = 0.225;
const lid = new THREE.Mesh(new RoundedBoxGeometry(LW, lidH, 0.006, 4, 0.0028), alu); lid.position.set(0, lidH / 2, -0.003); lid.castShadow = true; hinge.add(lid);
const bezel = new THREE.Mesh(new THREE.PlaneGeometry(LW - 0.006, lidH - 0.006), new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 0.2, metalness: 0.2 }));
bezel.position.set(0, lidH / 2, 0.0002); hinge.add(bezel);
const SW = LW - 0.022, SH = SW * 900 / 1440;
const screenMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), screenMat);
screen.position.set(0, lidH / 2 + 0.004, 0.0004); hinge.add(screen);
// Glass reflection on the screen
const glass = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.06, roughness: 0.05, metalness: 0, transmission: 0, clearcoat: 1 }));

hinge.rotation.x = -0.32; // lid tilted back ~18°

// Props: cup + saucer + beans
const ceramic = new THREE.MeshPhysicalMaterial({ color: 0xf5f1ea, roughness: 0.25, clearcoat: 0.6 });
const cupPts = [[0, 0], [0.028, 0], [0.032, 0.004], [0.036, 0.03], [0.04, 0.058], [0.041, 0.062], [0.038, 0.062], [0.034, 0.03], [0.03, 0.008], [0, 0.008]].map(([x, y]) => new THREE.Vector2(x, y));
const cup = new THREE.Mesh(new THREE.LatheGeometry(cupPts, 48), ceramic); cup.castShadow = true;
const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.0375, 48), new THREE.MeshStandardMaterial({ color: 0x6b3b1c, roughness: 0.3 })); coffee.rotation.x = -Math.PI / 2; coffee.position.y = 0.054;
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.016, 0.0045, 12, 32, Math.PI * 1.3), ceramic); handle.position.set(0.042, 0.035, 0); handle.rotation.z = -Math.PI * 0.65; handle.castShadow = true;
const saucer = new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [0.07, 0], [0.074, 0.006], [0.07, 0.008], [0.03, 0.005], [0, 0.005]].map(([x, y]) => new THREE.Vector2(x, y)), 48), ceramic); saucer.castShadow = saucer.receiveShadow = true;
const cupG = new THREE.Group(); cupG.add(saucer); const cupIn = new THREE.Group(); cupIn.position.y = 0.005; cupIn.add(cup, coffee, handle); cupG.add(cupIn);
cupG.position.set(0.2, 0, 0.21); cupG.rotation.y = -0.6; scene.add(cupG);
const beanMat = new THREE.MeshStandardMaterial({ color: 0x3d1f0c, roughness: 0.45 });
for (let i = 0; i < 9; i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.008, 16, 12), beanMat); b.scale.set(1, 0.6, 0.72);
  b.position.set(-0.2 + rnd() * 0.1, 0.005, 0.17 + rnd() * 0.1); b.rotation.y = rnd() * 6; b.castShadow = true; scene.add(b);
}
// Notebook
const nb = new THREE.Mesh(new RoundedBoxGeometry(0.15, 0.008, 0.2, 2, 0.003), new THREE.MeshStandardMaterial({ color: 0x2f3b33, roughness: 0.8 }));
nb.position.set(-0.27, 0.004, 0.05); nb.rotation.y = 0.35; nb.castShadow = nb.receiveShadow = true; scene.add(nb);

// Lights: low ambient, warm window key from back-left (rim on the laptop),
// a dim front fill, and the screen itself lighting the keyboard.
RectAreaLightUniformsLib.init();
scene.add(new THREE.HemisphereLight(0xffe8cc, 0x1a0f08, 0.22));
const sun = new THREE.DirectionalLight(0xffd3a0, 2.6); sun.position.set(-1.4, 1.3, -0.9); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = -0.9; sun.shadow.camera.right = 0.9; sun.shadow.camera.top = 0.9; sun.shadow.camera.bottom = -0.9; sun.shadow.radius = 5; sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.PointLight(0xffc890, 0.35, 3); fill.position.set(0.7, 0.45, 0.9); scene.add(fill);
const screenLight = new THREE.RectAreaLight(0xf3f0ff, 3.0, SW, SH);
screenLight.position.set(0, lidH / 2 + 0.004, 0.002); screenLight.rotation.y = 0; hinge.add(screenLight);

const camera = new THREE.PerspectiveCamera(28, W / H, 0.01, 20);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 1.0, aperture: 0.06, maxblur: 0.03 });
const FX = new URLSearchParams(location.search);
if (!FX.has('nodof')) composer.addPass(bokeh);
if (!FX.has('nobloom')) composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.35, 0.6, 0.9));
composer.addPass(new OutputPass());
const loader = new THREE.TextureLoader();
const ease = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = (x) => 1 - Math.pow(1 - x, 2);
const lerp = (a, b, k) => a + (b - a) * k;
// Shots: [angle around the laptop, distance, height, look-at height]
const OPEN = [0.9, 0.5, 0.1, 0.11], WIDE = [0.16, 1.2, 0.25, 0.11], END = [-0.07, 1.04, 0.23, 0.115];
const screenPos = new THREE.Vector3();

let opts = {};
window.setup = (o) => { opts = o; document.getElementById('hook').innerHTML = o.hook || ''; document.getElementById('tag').innerHTML = o.tag || ''; };
window.renderFrame = async (t, url) => {
  const tex = await loader.loadAsync(url); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  if (screenMat.map) screenMat.map.dispose(); screenMat.map = tex; screenMat.needsUpdate = true;
  // Camera: opens close on the side of the laptop, glides round to the
  // front as the site starts scrolling, then drifts in. Small handheld sway.
  const t1 = opts.intro || 2.5;
  const shot = t < t1 ? OPEN.map((v, i) => lerp(v, WIDE[i], ease(t / t1))) : WIDE.map((v, i) => lerp(v, END[i], easeOut((t - t1) / (opts.dur - t1))));
  const [ang, dist, y, ly] = shot;
  const sway = (f, p) => Math.sin(t * f + p) * 0.6 + Math.sin(t * f * 2.3 + p * 2) * 0.4;
  camera.position.set(Math.sin(ang) * dist + 0.0025 * sway(0.9, 1), y + 0.0018 * sway(1.1, 3), Math.cos(ang) * dist + 0.05);
  camera.lookAt(0.0012 * sway(0.7, 5), ly, 0.0);
  camera.rotation.z += 0.004 * sway(0.5, 2);
  screen.getWorldPosition(screenPos);
  bokeh.uniforms.focus.value = camera.position.distanceTo(screenPos);
  composer.render();
  const tg = document.getElementById('tag').style;
  const fade = (a, b, c, d2) => Math.max(0, Math.min(1, (t - a) / (b - a), (d2 - t) / (d2 - c)));
  tg.opacity = fade(opts.dur - 2.6, opts.dur - 2, opts.dur + 5, opts.dur + 6);
};
window.ready = true;
</script></body></html>
